name = "share-money"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Supabase is hosted in AWS ap-southeast-2 (Sydney). Pin dynamic Worker
# execution near the database; static assets remain edge-served near users.
[placement]
region = "aws:ap-southeast-2"

[assets]
directory = ".open-next/assets"

# Kept alive because the TWA released to Play as versionCode 3 still points at
# the workers.dev host; without it those installs get a 404 until users update.
workers_dev = true

[[routes]]
pattern = "sharemoney.cc"
custom_domain = true

