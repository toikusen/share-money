name = "share-money"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Top-level on purpose: under a [table] header this becomes e.g. assets.workers_dev
# and is silently ignored. Kept true because the TWA released to Play as
# versionCode 3 still opens the workers.dev host, and adding a route would
# otherwise infer workers_dev = false and 404 those installs.
workers_dev = true

# Supabase is hosted in AWS ap-southeast-2 (Sydney). Pin dynamic Worker
# execution near the database; static assets remain edge-served near users.
[placement]
region = "aws:ap-southeast-2"

[assets]
directory = ".open-next/assets"

[[routes]]
pattern = "sharemoney.cc"
custom_domain = true

[vars]
