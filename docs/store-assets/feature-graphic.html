<!doctype html>
<!-- Source for feature-graphic.png (1024x500). Regenerate: open in Chrome at
     1024x500, DPR 1, screenshot the viewport. -->
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1024px; height: 500px; overflow: hidden; position: relative;
    background: linear-gradient(115deg, #4f61c9 0%, #5a6ad4 55%, #6b74dd 100%);
    font-family: 'Helvetica Neue', 'PingFang TC', sans-serif;
    display: flex; align-items: center; gap: 56px; padding-left: 96px;
  }
  .blob { position: absolute; border-radius: 50%; background: rgba(255,255,255,.06); }
  .b1 { width: 420px; height: 420px; top: -140px; left: 120px; }
  .b2 { width: 300px; height: 300px; bottom: -110px; right: 60px; }
  .b3 { width: 180px; height: 180px; top: 40px; right: 220px; background: rgba(255,255,255,.04); }
  .icon {
    width: 200px; height: 200px; border-radius: 44px; flex-shrink: 0;
    position: relative; z-index: 1; box-shadow: 0 18px 44px rgba(20,26,70,.28);
  }
  .copy { position: relative; z-index: 1; }
  h1 { font-size: 62px; font-weight: 600; color: #fff; letter-spacing: .02em; }
  h1 .dot { opacity: .55; margin: 0 .1em; }
  .name { font-size: 30px; font-weight: 600; color: #fff; margin-top: 10px; letter-spacing: .04em; }
  .tag { font-size: 26px; font-weight: 600; color: rgba(255,255,255,.92); margin-top: 14px; }
  .chips { display: flex; gap: 12px; margin-top: 26px; }
  .chip {
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22);
    color: #fff; font-size: 19px; font-weight: 500;
    padding: 9px 20px; border-radius: 999px; white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <img class="icon" src="../../public/icon-512.png" alt="">
  <div class="copy">
    <h1>share<span class="dot">·</span>money</h1>
    <div class="name">ShareMoney 分帳</div>
    <div class="tag">大家一起花的錢，算清楚不傷感情</div>
    <div class="chips">
      <span class="chip">旅遊</span>
      <span class="chip">聚餐</span>
      <span class="chip">社團活動</span>
      <span class="chip">合租公費</span>
    </div>
  </div>
</body>
</html>
